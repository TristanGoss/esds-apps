# Per-client request limits. The general limit is generous because door scanning is bursty and the whole door team may
# share one venue IP; the auth limit only exists to stop hammering of the sign-in endpoints.
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

# Catch-alls for anything not addressed to our hostname (IP scans, stale DNS records, forged Host headers): without
# these, nginx would serve the application to any Host header at all.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name apps.esds.org.uk;
    server_tokens off;

    # allow certbot --webroot renewals
    location /.well-known/acme-challenge/ {
        root /mnt/certbot_webroot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name apps.esds.org.uk;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/apps.esds.org.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/apps.esds.org.uk/privkey.pem; # managed by Certbot

    # TLS 1.2+ with forward-secret AEAD ciphers only (Mozilla "intermediate", minus the DHE suites that would need
    # dhparams). Session tickets are off so a long-lived ticket key cannot undermine forward secrecy.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Shed slow or stalled clients rather than holding connections open for the nginx default of 60s.
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    include /etc/nginx/conf.d/security_headers.inc;

    # Dotfiles and VCS metadata (.git/, .env, .htaccess, ...) are never served by the application.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # defend against scanners
    location ~* \.(git|htaccess|env|log|bak|ini|swp|sql)$ {
        deny all;
        return 403;
    }

    # Block all wp-* paths (WordPress scanners)
    location ~* /wp- {
        deny all;
        return 403;
    }

    # Block xmlrpc.php (used for spam, brute-force, etc)
    location = /xmlrpc.php {
        deny all;
        return 403;
    }

    location /auth/ {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/conf.d/proxy_app.inc;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/conf.d/proxy_app.inc;
    }
}
