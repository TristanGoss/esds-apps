[project]
name = "esds_apps"
version = "0.1.0"
description = "Backend FastAPI package for various applications designed to help the Edinburgh Swing Dance Society."
authors = [
    {name = "Tristan Goss",email = "tristanjdgoss@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "cairosvg (>=2.9.1,<3.0.0)",
    "lxml (>=6.1.3,<7.0.0)",
    "segno (>=1.6.6,<2.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "weasyprint (>=70.0,<71.0)",
    "joserfc (>=1.7.7,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytz (>=2026.5,<2027.0)",
    "cryptography (>=50.0.2,<51.0.0)",
    "openpyxl (>=3.1.0,<4.0.0)",
    "rapidfuzz (>=3.14.6,<4.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "python-dateutil (>=3.0.0,<4.0.0)",
]

[tool.poetry]
packages = [{include = "esds_apps", from = "src"}]


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.7.0"
ruff = "0.17.2"
matplotlib = "^3.11.2"
ipywidgets = "^8.1.9"
ipykernel = "^7.4.0"
pip-audit = "^2.10.1"


[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.4.0"
respx = "^0.23.1"
httpx2 = "^2.16.0"  # starlette.testclient prefers this over httpx (respx still mocks the app's httpx)

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
exclude = ["working/"]

[tool.ruff.lint]
select = [
    "C90",      # Cyclomatic complexity
    "D",        # pydocstyle
    "E",        # pycodestyle
    "F",        # pyflakes
    "I",        # Sort imports
    "PLR",      # pylint
]
ignore = [
    "D100",  # no module docstring
    "D101",  # no class docstring
    "D103",  # no function docstring
    "D104",  # no package docstring
    "D105",  # no magic method docstring
    "D107",  # no __init__ docstring
    "PLR0917",  # too many positional args: duplicates PLR0913 (max-args), which is already noqa'd per function
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-fail-under=80"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"